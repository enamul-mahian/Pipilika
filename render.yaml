services:
  - type: web
    name: pipilika
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/app/config
    disk: { name: storage, mountPath: /data, sizeGB: 5 }
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pipilika-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://thepipilika.com
      - key: OTP_DEV_SHOW
        value: "false"
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: /data/storage
databases:
  - name: pipilika-db
    plan: basic-256mb
